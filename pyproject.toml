[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["backend", "."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/env.py" = ["E402"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
